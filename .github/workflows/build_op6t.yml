name: Build OnePlus 6T Pentest Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - HEAD
  pull_request:
    branches:
      - HEAD

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      KERNEL_DEFCONFIG: "Acai-Nethunter-V9_defconfig"
      KERNEL_CMDLINE: "ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"
      KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Clone Nethunter Kernel Source
        run: |
          git clone --depth=100 -b hentai-q https://github.com/plushie-neko/op6-op6t-nethunter-kernel kernel-source

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt install gcc-aarch64-linux-gnu -y
          sudo apt install gcc-arm-linux-gnueabi -y
          sudo apt install aria2 binutils make python3 libssl-dev build-essential bc bison flex unzip libssl-dev ca-certificates xz-utils mkbootimg cpio device-tree-compiler git git-lfs -y

      - name: Integrate SukiSU-Ultra + SusFS
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main

      - name: Download ZyCromerZ Clang 10
        run: |
          cd kernel-source
          aria2c -j$(nproc --all) $(curl -fsSL https://github.com/ZyCromerZ/Clang/raw/main/Clang-10-link.txt)
          mkdir zyc-clang
          tar -xzf Clang-*.tar.gz -C zyc-clang > /dev/null
          rm -f Clang-*.tar.gz

      - name: Download KPM Patcher
        run: |
          aria2c -j$(nproc --all) $KPM_PATCH_SOURCE
          sudo install -m 755 patch_linux /usr/bin/kpmpatcher
          rm patch_linux

      - name: Setup AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' AnyKernel3/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
          rm -rf AnyKernel3/.git* AnyKernel3/README.md

      - name: Build Kernel
        run: |
          cd kernel-source
          export PATH=$(pwd)/zyc-clang/bin/:$PATH
          make $KERNEL_CMDLINE $KERNEL_DEFCONFIG CC="ccache clang"
          make $KERNEL_CMDLINE CC="ccache clang" -j$(nproc --all)

      - name: KPM Patcher
        run: |
          cd kernel-source/out/arch/arm64/boot
          if [[ -f "Image" ]]; then
              kpmpatcher
              mv oImage Image
              echo "Hook Image successfully!"
          else
              echo "No valid Image file found."
              exit 1
          fi
          cp Image ../../../../AnyKernel3 || cp Image ../../../../../AnyKernel3

      - name: Get Time
        id: get_time
        run: |
          echo "TIME=$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OP6T-Pentest-KSUN-${{ steps.get_time.outputs.TIME }}
          path: "AnyKernel3/*"
